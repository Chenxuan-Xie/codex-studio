name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile
        run: python -m py_compile server.py
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Check static files exist
        run: python -c "from pathlib import Path; assert Path('static/index.html').is_file(); assert Path('static/app.js').is_file()"
